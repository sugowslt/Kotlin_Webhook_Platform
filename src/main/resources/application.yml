spring:
  application:
    name: hook-relay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hook_relay}
    username: ${DB_USERNAME:hook_relay}
    password: ${DB_PASSWORD:hook_relay}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  task:
    scheduling:
      pool:
        size: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

hook-relay:
  metrics:
    queue-snapshot-interval-millis: 5000
  security:
    allowed-schemes: https
    allow-non-public-targets: false
    operator-token: ${HOOK_RELAY_OPERATOR_TOKEN:}
  worker:
    enabled: true
    batch-size: 20
    lease-seconds: 30
    request-timeout-seconds: 5
    poll-interval-millis: 1000
